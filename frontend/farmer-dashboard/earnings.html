<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnings</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--green-dark:#1a3a1a;--green-mid:#2d5a1b;--green-light:#4a7c2f;--green-pale:#e8f0e0;--amber:#e8a020;--amber-light:#f5c842;--cream:#faf6ed;--white:#fff;--text-dark:#1a2a0a;--text-mid:#3a4a2a;--text-light:#6a7a5a;--border:#d4e0c4;--red:#d94f4f;}
  *{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;font-family:'DM Sans',sans-serif;background:#f0f4ea;color:var(--text-dark);}
  body{display:flex;flex-direction:column;}
  .topbar{flex-shrink:0;background:var(--white);padding:16px 32px;border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(0,0,0,0.05);}
  .topbar h2{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;}
  .topbar p{font-size:0.8rem;color:var(--text-light);margin-top:2px;}
  .content{flex:1;overflow-y:auto;padding:24px 32px;}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .sc{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,0.04);}
  .sc .val{font-size:1.5rem;font-weight:700;}.sc .lbl{font-size:0.75rem;color:var(--text-light);margin-top:3px;}
  .sc .val.green{color:var(--green-light);}.sc .val.amber{color:var(--amber);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
  .card{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,0.04);}
  .card-header{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .card-header h3{font-size:0.95rem;font-weight:700;}
  .card-body{padding:16px 20px;}
  .earn-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
  .earn-row:last-child{border-bottom:none;}
  .earn-row .lbl{font-size:0.82rem;color:var(--text-mid);}.earn-row .val{font-size:0.88rem;font-weight:700;}
  .earn-row .val.green{color:var(--green-light);}.earn-row .val.amber{color:var(--amber);}
  .month-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
  .month-row:last-child{border-bottom:none;}
  .month-row .month{font-size:0.85rem;font-weight:600;}.month-row .cnt{font-size:0.72rem;color:var(--text-light);}
  .month-row .total{font-size:0.9rem;font-weight:700;color:var(--green-light);}
  .progress-mini{height:5px;background:var(--green-pale);border-radius:4px;margin-top:5px;overflow:hidden;}
  .progress-mini-fill{height:100%;background:linear-gradient(90deg,var(--green-light),var(--amber));border-radius:4px;}
  .empty{text-align:center;padding:32px;color:var(--text-light);font-size:0.85rem;}
  .skeleton{background:linear-gradient(90deg,#e8f0e0 25%,#d4e0c4 50%,#e8f0e0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:8px;height:16px;margin-bottom:8px;}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<header class="topbar"><h2>💰 Earnings</h2><p>Your revenue breakdown and financial summary</p></header>
<div class="content">
  <div class="stats-grid">
    <div class="sc"><div class="val green" id="e-month">—</div><div class="lbl">This Month</div></div>
    <div class="sc"><div class="val"        id="e-net">—</div><div class="lbl">Net (after fee)</div></div>
    <div class="sc"><div class="val amber"  id="e-pending">—</div><div class="lbl">Pending Payout</div></div>
    <div class="sc"><div class="val"        id="e-all">—</div><div class="lbl">All-Time Revenue</div></div>
  </div>
  <div class="two-col">
    <div class="card">
      <div class="card-header"><h3>💵 This Month Summary</h3></div>
      <div class="card-body" id="earn-summary"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
    <div class="card">
      <div class="card-header"><h3>📅 Monthly Breakdown</h3></div>
      <div class="card-body" id="monthly-breakdown"><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>
  async function loadEarnings(){
    const data=await apiFetch(`farmer_earnings.php?farmer_id=${farmerId()}`);
    if(data.error) return;
    document.getElementById('e-month').textContent  =formatMoney(data.month_total);
    document.getElementById('e-net').textContent    =formatMoney(data.net_earnings);
    document.getElementById('e-pending').textContent=formatMoney(data.pending_payout);
    document.getElementById('e-all').textContent    =formatMoney(data.all_time);
    const es=document.getElementById('earn-summary');
    es.innerHTML=`
      <div class="earn-row"><span class="lbl">Gross Sales</span><span class="val green">${formatMoney(data.month_total)}</span></div>
      <div class="earn-row"><span class="lbl">Platform Fee (5%)</span><span class="val">− ${formatMoney(data.platform_fee)}</span></div>
      <div class="earn-row"><span class="lbl">Net Earnings</span><span class="val green">${formatMoney(data.net_earnings)}</span></div>
      <div class="earn-row"><span class="lbl">Pending Payout</span><span class="val amber">${formatMoney(data.pending_payout)}</span></div>
      <div class="earn-row"><span class="lbl">Last Payout</span><span class="val">${formatMoney(data.last_payout)}${data.last_payout_date?' · '+formatDate(data.last_payout_date):''}</span></div>`;
    const mb=document.getElementById('monthly-breakdown');
    const months=data.monthly_breakdown||[];
    if(!months.length){mb.innerHTML='<div class="empty">No data yet.</div>';return;}
    const max=Math.max(...months.map(m=>parseFloat(m.total)),1);
    mb.innerHTML=months.map(m=>`
      <div class="month-row">
        <div><div class="month">${m.month}</div><div class="cnt">${m.order_count} orders</div>
          <div class="progress-mini"><div class="progress-mini-fill" style="width:${Math.round(parseFloat(m.total)/max*100)}%"></div></div>
        </div>
        <div class="total">${formatMoney(m.total)}</div>
      </div>`).join('');
  }
  loadEarnings();
</script>
</body>
</html>
