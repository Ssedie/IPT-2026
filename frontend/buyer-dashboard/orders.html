<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--green-dark:#1a3a1a;--green-mid:#2d5a1b;--green-light:#4a7c2f;--green-pale:#e8f0e0;--amber:#e8a020;--amber-light:#f5c842;--cream:#faf6ed;--white:#fff;--text-dark:#1a2a0a;--text-mid:#3a4a2a;--text-light:#6a7a5a;--border:#d4e0c4;--red:#d94f4f;--blue:#3a7bd5;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;font-family:'DM Sans',sans-serif;background:#f0f4ea;color:var(--text-dark);}
  body{display:flex;flex-direction:column;}
  .topbar{flex-shrink:0;background:var(--white);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(0,0,0,0.05);}
  .topbar h2{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;}
  .topbar p{font-size:0.8rem;color:var(--text-light);margin-top:2px;}
  .content{flex:1;overflow-y:auto;padding:24px 32px;}
  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab{padding:8px 20px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-weight:600;font-size:0.85rem;transition:all 0.2s;font-family:'DM Sans',sans-serif;}
  .tab.active{background:var(--amber);border-color:var(--amber);color:var(--green-dark);}
  .order-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:20px 24px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,0.04);}
  .order-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .order-id{font-size:0.78rem;color:var(--text-light);}
  .badge{display:inline-block;font-size:0.65rem;font-weight:700;padding:4px 10px;border-radius:8px;}
  .badge-transit  {background:rgba(58,123,213,0.12);color:#2a5da8;}
  .badge-pending  {background:rgba(232,160,32,0.15);color:#b07010;}
  .badge-delivered{background:rgba(74,124,47,0.12); color:#2d6a10;}
  .badge-cancelled{background:rgba(217,79,79,0.1);  color:#c03030;}
  .badge-disputed {background:rgba(155,60,200,0.1); color:#7b2ca8;}
  .order-main{display:flex;align-items:center;gap:14px;}
  .order-icon{width:48px;height:48px;border-radius:12px;background:var(--green-pale);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
  .order-info h4{font-size:0.95rem;font-weight:700;}
  .order-info p{font-size:0.78rem;color:var(--text-light);margin-top:3px;}
  .order-info .date{font-size:0.72rem;color:var(--text-light);margin-top:4px;}
  .order-amount{margin-left:auto;text-align:right;flex-shrink:0;}
  .order-amount .total{font-size:1.1rem;font-weight:700;color:var(--text-dark);}
  .order-actions{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .btn-confirm-del{flex:1;padding:9px;background:var(--green-light);color:white;border:none;border-radius:9px;font-weight:700;font-size:0.8rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background 0.2s;}
  .btn-confirm-del:hover{background:var(--green-dark);}
  .btn-cancel-order{flex:1;padding:9px;background:var(--cream);border:1.5px solid var(--border);border-radius:9px;font-weight:600;font-size:0.8rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s;}
  .btn-cancel-order:hover{background:#fde8e8;border-color:var(--red);color:var(--red);}
  .btn-dispute{flex:1;padding:9px;background:var(--cream);border:1.5px solid var(--border);border-radius:9px;font-weight:600;font-size:0.8rem;cursor:pointer;font-family:'DM Sans',sans-serif;}
  .btn-dispute:hover{background:rgba(155,60,200,0.08);border-color:#9b3cc8;color:#7b2ca8;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-light);}
  .empty-state .ei{font-size:3.5rem;margin-bottom:14px;}
  .empty-state h3{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--text-dark);margin-bottom:8px;}
  .btn-browse{padding:11px 28px;background:var(--amber);color:var(--green-dark);border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:14px;}
  .skeleton{background:linear-gradient(90deg,#e8f0e0 25%,#d4e0c4 50%,#e8f0e0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:12px;height:120px;margin-bottom:12px;}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* Dispute modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:none;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--white);border-radius:20px;padding:28px;width:90%;max-width:440px;}
  .modal h3{font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:16px;}
  .modal textarea{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.88rem;outline:none;resize:vertical;min-height:100px;}
  .modal textarea:focus{border-color:var(--red);}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .btn-close-modal{flex:1;padding:11px;border:1.5px solid var(--border);border-radius:10px;background:var(--cream);cursor:pointer;font-weight:600;font-family:'DM Sans',sans-serif;}
  .btn-submit-dispute{flex:1;padding:11px;border:none;border-radius:10px;background:var(--red);color:white;cursor:pointer;font-weight:700;font-family:'DM Sans',sans-serif;}
  .btn-submit-dispute:disabled{opacity:0.5;cursor:not-allowed;}
</style>
</head>
<body>

<header class="topbar">
  <div>
    <h2>📦 Active Orders</h2>
    <p>Track and manage your current orders</p>
  </div>
</header>

<div class="content">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('active', this)">Active</button>
    <button class="tab" onclick="switchTab('history', this)">History</button>
  </div>
  <div id="orders-list">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</div>

<!-- DISPUTE MODAL -->
<div class="modal-overlay" id="dispute-modal">
  <div class="modal">
    <h3>⚖️ File a Dispute</h3>
    <input type="hidden" id="dispute-order-id">
    <label style="display:block;font-size:0.8rem;font-weight:600;color:var(--text-mid);margin-bottom:6px;">Reason for dispute</label>
    <textarea id="dispute-reason" placeholder="Describe the issue with this order..."></textarea>
    <div class="modal-actions">
      <button class="btn-close-modal" onclick="closeDisputeModal()">Cancel</button>
      <button class="btn-submit-dispute" id="dispute-submit" onclick="submitDispute()">Submit Dispute</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  let currentTab = 'active';

  function switchTab(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    loadOrders();
  }

  async function loadOrders() {
    const list = document.getElementById('orders-list');
    list.innerHTML = '<div class="skeleton"></div>'.repeat(3);
    const data = await apiFetch(`buyer_orders.php?buyer_id=${buyerId()}&status=${currentTab}`);
    const orders = data.orders || [];

    if (!orders.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="ei">📭</div>
          <h3>${currentTab === 'active' ? 'No active orders' : 'No order history yet'}</h3>
          <p>${currentTab === 'active' ? 'Browse listings to place your first order.' : 'Completed orders will appear here.'}</p>
          ${currentTab === 'active' ? '<button class="btn-browse" onclick="navTo(\'browse.html\')">Browse Listings</button>' : ''}
        </div>`;
      return;
    }

    list.innerHTML = orders.map(o => {
      const actions = currentTab === 'active' ? buildActions(o) : '';
      return `
        <div class="order-card">
          <div class="order-top">
            <span class="order-id">Order #${o.id} · ${formatDate(o.created_at)}</span>
            ${statusBadge(o.status)}
          </div>
          <div class="order-main">
            <div class="order-icon">📦</div>
            <div class="order-info">
              <h4>${o.product_name}</h4>
              <p>From <strong>${o.seller_name}</strong></p>
              <p class="date">${o.unit}</p>
            </div>
            <div class="order-amount">
              <div class="total">${formatMoney(o.total_amount)}</div>
            </div>
          </div>
          ${actions}
        </div>`;
    }).join('');
  }

  function buildActions(o) {
    if (o.status === 'pending') return `
      <div class="order-actions">
        <button class="btn-cancel-order" onclick="orderAction(${o.id},'cancel')">✕ Cancel Order</button>
      </div>`;
    if (o.status === 'shipped') return `
      <div class="order-actions">
        <button class="btn-confirm-del" onclick="orderAction(${o.id},'confirm_delivery')">✓ Confirm Delivery</button>
        <button class="btn-dispute" onclick="openDisputeModal(${o.id})">⚖️ Dispute</button>
      </div>`;
    if (o.status === 'delivered') return `
      <div class="order-actions">
        <button class="btn-dispute" onclick="openDisputeModal(${o.id})">⚖️ File Dispute</button>
      </div>`;
    return '';
  }

  async function orderAction(orderId, action) {
    const labels = { cancel: 'Cancel this order?', confirm_delivery: 'Confirm you received this order?' };
    if (!confirm(labels[action])) return;
    const res = await apiFetch('buyer_order_action.php', {
      method: 'POST',
      body: JSON.stringify({ buyer_id: buyerId(), order_id: orderId, action })
    });
    if (res.error) { showToast(res.error, 'error'); return; }
    showToast(res.message);
    loadOrders();
  }

  function openDisputeModal(orderId) {
    document.getElementById('dispute-order-id').value = orderId;
    document.getElementById('dispute-reason').value   = '';
    document.getElementById('dispute-modal').classList.add('open');
  }

  function closeDisputeModal() {
    document.getElementById('dispute-modal').classList.remove('open');
  }

  async function submitDispute() {
    const btn    = document.getElementById('dispute-submit');
    const reason = document.getElementById('dispute-reason').value.trim();
    const orderId = document.getElementById('dispute-order-id').value;
    if (!reason) { showToast('Please describe the issue', 'error'); return; }

    btn.disabled = true; btn.textContent = 'Submitting...';
    const res = await apiFetch(`disputes.php?buyer_id=${buyerId()}`, {
      method: 'POST',
      body: JSON.stringify({ buyer_id: buyerId(), order_id: orderId, reason })
    });
    btn.disabled = false; btn.textContent = 'Submit Dispute';

    if (res.error) { showToast(res.error, 'error'); return; }
    showToast('Dispute filed successfully');
    closeDisputeModal();
    loadOrders();
  }

  document.getElementById('dispute-modal').addEventListener('click', function(e) {
    if (e.target === this) closeDisputeModal();
  });

  loadOrders();
</script>
</body>
</html>
