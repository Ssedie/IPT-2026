<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disputes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--green-dark:#1a3a1a;--green-mid:#2d5a1b;--green-light:#4a7c2f;--green-pale:#e8f0e0;--amber:#e8a020;--amber-light:#f5c842;--cream:#faf6ed;--white:#fff;--text-dark:#1a2a0a;--text-mid:#3a4a2a;--text-light:#6a7a5a;--border:#d4e0c4;--red:#d94f4f;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;font-family:'DM Sans',sans-serif;background:#f0f4ea;color:var(--text-dark);}
  body{display:flex;flex-direction:column;}
  .topbar{flex-shrink:0;background:var(--white);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(0,0,0,0.05);}
  .topbar h2{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;}
  .topbar p{font-size:0.8rem;color:var(--text-light);margin-top:2px;}
  .content{flex:1;overflow-y:auto;padding:24px 32px;}
  .info-box{background:rgba(232,160,32,0.1);border:1px solid rgba(232,160,32,0.3);border-radius:12px;padding:14px 18px;font-size:0.82rem;color:#7a5a00;margin-bottom:20px;line-height:1.6;}
  .dispute-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:20px 24px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,0.04);}
  .d-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .d-id{font-size:0.78rem;color:var(--text-light);}
  .badge{display:inline-block;font-size:0.65rem;font-weight:700;padding:4px 10px;border-radius:8px;}
  .badge-open    {background:rgba(232,160,32,0.15);color:#b07010;}
  .badge-resolved{background:rgba(74,124,47,0.12); color:#2d6a10;}
  .badge-in_review{background:rgba(58,123,213,0.12);color:#2a5da8;}
  .badge-urgent  {background:rgba(217,79,79,0.12); color:#c03030;}
  .d-body h4{font-size:0.95rem;font-weight:700;margin-bottom:4px;}
  .d-body p{font-size:0.8rem;color:var(--text-light);margin-bottom:8px;}
  .d-reason{background:var(--cream);border-radius:8px;padding:10px 14px;font-size:0.82rem;color:var(--text-mid);border-left:3px solid var(--amber);}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-light);}
  .empty-state .ei{font-size:3.5rem;margin-bottom:14px;}
  .empty-state h3{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--text-dark);margin-bottom:8px;}
  .skeleton{background:linear-gradient(90deg,#e8f0e0 25%,#d4e0c4 50%,#e8f0e0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:12px;height:120px;margin-bottom:12px;}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<header class="topbar">
  <div><h2>⚖️ Disputes</h2><p>Your filed disputes and their status</p></div>
</header>
<div class="content">
  <div class="info-box">ℹ️ You can file a dispute on any shipped or delivered order. Go to <strong>Active Orders</strong> and click "Dispute" on the relevant order. Our team will review within 24–48 hours.</div>
  <div id="disputes-list">
    <div class="skeleton"></div><div class="skeleton"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
  async function loadDisputes() {
    const list = document.getElementById('disputes-list');
    const data = await apiFetch(`disputes.php?buyer_id=${buyerId()}`);
    const disputes = data.disputes || [];

    if (!disputes.length) {
      list.innerHTML = `<div class="empty-state"><div class="ei">⚖️</div><h3>No disputes filed</h3><p>If you have an issue with an order, go to Active Orders and click "Dispute".</p><button onclick="navTo('orders.html')" style="margin-top:14px;padding:10px 24px;background:var(--amber);color:var(--green-dark);border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;">View Orders</button></div>`;
      return;
    }

    const badgeMap = { open:'badge-open', resolved:'badge-resolved', in_review:'badge-in_review', urgent:'badge-urgent' };
    list.innerHTML = disputes.map(d => `
      <div class="dispute-card">
        <div class="d-top">
          <span class="d-id">Dispute #${d.id} · Order #${d.order_id} · ${formatDate(d.created_at)}</span>
          <span class="badge ${badgeMap[d.status]||'badge-open'}">${d.status.replace('_',' ').toUpperCase()}</span>
        </div>
        <div class="d-body">
          <h4>${d.product_name}</h4>
          <p>Seller: <strong>${d.seller_name}</strong> · Order Total: ${formatMoney(d.total_amount)}</p>
          <div class="d-reason">💬 "${d.reason}"</div>
        </div>
      </div>`).join('');
  }

  loadDisputes();
</script>
</body>
</html>
