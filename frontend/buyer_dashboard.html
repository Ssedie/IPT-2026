<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmVille — Buyer Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green-dark: #1a3a1a;
    --green-mid: #2d5a1b;
    --green-light: #4a7c2f;
    --green-pale: #e8f0e0;
    --amber: #e8a020;
    --amber-light: #f5c842;
    --cream: #faf6ed;
    --white: #ffffff;
    --text-dark: #1a2a0a;
    --text-mid: #3a4a2a;
    --text-light: #6a7a5a;
    --border: #d4e0c4;
    --sidebar-w: 260px;
    --red: #d94f4f;
    --blue: #3a7bd5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: #f0f4ea; color: var(--text-dark); overflow: hidden; }
  body { display: flex; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--green-dark); height: 100vh;
    position: fixed; left: 0; top: 0;
    display: flex; flex-direction: column; z-index: 50;
    box-shadow: 4px 0 32px rgba(0,0,0,0.2);
  }
  .sidebar-logo {
    flex-shrink: 0; padding: 24px 22px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: center; gap: 11px;
  }
  .logo-icon {
    width: 40px; height: 40px; background: var(--amber); border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; box-shadow: 0 2px 12px rgba(232,160,32,0.35); flex-shrink: 0;
  }
  .sidebar-logo span { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 900; color: var(--amber); }

  .sidebar-user {
    flex-shrink: 0; padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.03);
  }
  .user-avatar {
    width: 44px; height: 44px; background: var(--green-mid); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; border: 2px solid rgba(232,160,32,0.35); flex-shrink: 0;
  }
  .user-info h4 { font-size: 0.875rem; font-weight: 600; color: var(--white); line-height: 1.3; }
  .user-info p  { font-size: 0.72rem; color: rgba(255,255,255,0.42); margin-top: 1px; }
  .buyer-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(58,123,213,0.22); color: #7ab3f5;
    font-size: 0.6rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-top: 5px;
    border: 1px solid rgba(58,123,213,0.28);
  }

  .sidebar-nav {
    flex: 1; min-height: 0; padding: 10px 12px 4px;
    overflow-y: scroll; overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: rgba(232,160,32,0.3) rgba(255,255,255,0.04);
  }
  .sidebar-nav::-webkit-scrollbar { width: 4px; }
  .sidebar-nav::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 4px; margin: 8px 0; }
  .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(232,160,32,0.3); border-radius: 4px; }
  .sidebar-nav::-webkit-scrollbar-thumb:hover { background: rgba(232,160,32,0.6); }

  .nav-section-label {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
    color: rgba(255,255,255,0.22); padding: 14px 12px 5px; user-select: none;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.15s;
    margin-bottom: 1px; color: rgba(255,255,255,0.55);
    font-size: 0.865rem; font-weight: 500; text-decoration: none; user-select: none;
  }
  .nav-item:hover { background: rgba(255,255,255,0.07); color: var(--white); transform: translateX(2px); }
  .nav-item.active { background: var(--amber); color: var(--green-dark); font-weight: 700; box-shadow: 0 2px 12px rgba(232,160,32,0.28); transform: none; }
  .nav-item.active:hover { background: var(--amber-light); }
  .nav-item .icon { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }

  .nav-badge {
    margin-left: auto; color: white; font-size: 0.6rem; font-weight: 700;
    padding: 2px 7px; border-radius: 10px; min-width: 20px; text-align: center;
    flex-shrink: 0; background: var(--red); animation: pulse 2.5s ease-in-out infinite;
  }
  .nav-badge.blue { background: var(--blue); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

  .sidebar-footer {
    flex-shrink: 0; padding: 8px 12px 16px;
    border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.1);
  }
  .sidebar-footer .nav-item { color: rgba(255,255,255,0.35); font-size: 0.825rem; }
  .sidebar-footer .nav-item:hover { color: rgba(255,255,255,0.65); transform: translateX(2px); }

  /* ── MAIN ── */
  .main { margin-left: var(--sidebar-w); flex: 1; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #content-frame { flex: 1; border: none; width: 100%; height: 100%; background: #f0f4ea; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🌾</div>
    <span>FARMVILLE</span>
  </div>
  <div class="sidebar-user">
    <div class="user-avatar">🛍️</div>
    <div class="user-info">
      <h4 id="sidebar-name">Loading...</h4>
      <p  id="sidebar-email">...</p>
      <div class="buyer-badge">🛍️ Buyer Account</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Marketplace</div>
    <a class="nav-item" data-page="buyer-dashboard/index.html"      onclick="navigate(this);return false;" href="#"><span class="icon">🏠</span> Dashboard</a>
    <a class="nav-item" data-page="buyer-dashboard/browse.html"         onclick="navigate(this);return false;" href="#"><span class="icon">🔍</span> Browse Listings</a>
    <a class="nav-item" data-page="buyer-dashboard/saved.html"          onclick="navigate(this);return false;" href="#"><span class="icon">⭐</span> Saved Listings</a>
    <a class="nav-item" data-page="buyer-dashboard/cart.html"           onclick="navigate(this);return false;" href="#"><span class="icon">🛒</span> My Cart <span class="nav-badge blue">4</span></a>

    <div class="nav-section-label">My Orders</div>
    <a class="nav-item" data-page="buyer-dashboard/orders.html"         onclick="navigate(this);return false;" href="#"><span class="icon">📦</span> Active Orders <span class="nav-badge blue">2</span></a>
    <a class="nav-item" data-page="buyer-dashboard/order_history.html"  onclick="navigate(this);return false;" href="#"><span class="icon">🕐</span> Order History</a>
    <a class="nav-item" data-page="buyer-dashboard/disputes.html"       onclick="navigate(this);return false;" href="#"><span class="icon">⚖️</span> Disputes</a>

    <div class="nav-section-label">Account</div>
    <a class="nav-item" data-page="buyer-dashboard/messages.html"       onclick="navigate(this);return false;" href="#"><span class="icon">💬</span> Messages <span class="nav-badge">3</span></a>
    <a class="nav-item" data-page="buyer-dashboard/notification.html"   onclick="navigate(this);return false;" href="#"><span class="icon">🔔</span> Notifications</a>
    <a class="nav-item" data-page="buyer-dashboard/profile.html"        onclick="navigate(this);return false;" href="#"><span class="icon">👤</span> My Profile</a>
  </nav>

  <div class="sidebar-footer">
    <a class="nav-item" href="index.html"><span class="icon">🌐</span> Back to Site</a>
    <a class="nav-item" onclick="logout();return false;" href="#"><span class="icon">🚪</span> Logout</a>
  </div>
</aside>

<main class="main">
  <iframe id="content-frame" src="buyer-dashboard/index.html" title="Content"></iframe>
</main>

<script>
  /* ── Auth guard ── */
  const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
  if (!currentUser) {
    window.location.href = 'login.html';
  } else if (currentUser.role !== 'buyer') {
    window.location.href = 'farmer_dashboard.html';
  } else {
    document.getElementById('sidebar-name').textContent  = currentUser.full_name || 'Buyer';
    document.getElementById('sidebar-email').textContent = currentUser.email || '';
  }

  /* ── Active state on load ── */
  setActiveByPage("buyer-dashboard/index.html");

  /* ── Sidebar link click ── */
  function navigate(el) {
    const page = el.getAttribute('data-page');
    setActiveByPage(page);
    document.getElementById('content-frame').src = page;
  }

  /* ── Called by pages inside the iframe ── */
  function navigateTo(page) {
    setActiveByPage(page);
    document.getElementById('content-frame').src = page;
  }

  function setActiveByPage(page) {
    document.querySelectorAll('.sidebar-nav .nav-item').forEach(i => {
      i.classList.toggle('active', i.getAttribute('data-page') === page);
    });
  }

  function logout() {
    localStorage.removeItem('user');
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
