<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Listings</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&display=swap');

/* ═══════════════════════════════════════════
   FARMVILLE — Page CSS (loads inside iframe)
   All pages share this file via <link>
═══════════════════════════════════════════ */

:root {
  --green-dark:  #1a3a1a;
  --green-mid:   #2d5a1b;
  --green-light: #4a7c2f;
  --green-pale:  #e8f0e0;
  --green-xpale: #f2f7ee;
  --amber:       #e8a020;
  --amber-light: #f5c842;
  --amber-pale:  #fdf3e0;
  --cream:       #faf6ed;
  --white:       #ffffff;
  --text-dark:   #1a2a0a;
  --text-mid:    #3a4a2a;
  --text-light:  #6a7a5a;
  --border:      #d4e0c4;
  --red:         #c94040;
  --red-pale:    #fdf0f0;
  --blue:        #3a7bd5;
  --blue-pale:   #eef4fd;
  --shadow-sm:   0 1px 4px rgba(26,58,26,0.06);
  --shadow-md:   0 4px 20px rgba(26,58,26,0.10);
  --shadow-lg:   0 12px 40px rgba(26,58,26,0.14);
  --radius:      14px;
  --radius-sm:   8px;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html {
  height: 100%;
  overflow-x: hidden;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--green-xpale);
  color: var(--text-dark);
  min-height: 100%;
  padding: 28px 32px 40px;
  animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Page header ── */
.page-header {
  margin-bottom: 28px;
}
.page-header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.75rem; font-weight: 900;
  color: var(--text-dark); line-height: 1.1;
  margin-bottom: 4px;
}
.page-header p {
  font-size: 0.85rem; color: var(--text-light);
}

/* ── Stat grid ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.stat-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 20px 22px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  position: relative; overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

.stat-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.stat-card.green::before { background: linear-gradient(90deg, var(--green-mid), var(--green-light)); }
.stat-card.amber::before { background: linear-gradient(90deg, var(--amber), var(--amber-light)); }
.stat-card.blue::before  { background: linear-gradient(90deg, var(--blue), #6ba3e8); }
.stat-card.red::before   { background: linear-gradient(90deg, var(--red), #e07070); }

.stat-icon {
  font-size: 1.5rem; margin-bottom: 10px; display: block;
}
.stat-label {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--text-light); margin-bottom: 4px;
}
.stat-value {
  font-family: 'Playfair Display', serif;
  font-size: 2rem; font-weight: 900; color: var(--text-dark);
  line-height: 1; margin-bottom: 4px;
}
.stat-sub { font-size: 0.75rem; color: var(--text-light); }
.stat-sub.up   { color: var(--green-mid); }
.stat-sub.down { color: var(--red); }

/* ── Card ── */
.card {
  background: var(--white);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  margin-bottom: 22px;
  overflow: hidden;
}

.card-header {
  padding: 16px 22px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--cream);
}
.card-header h2 {
  font-size: 0.95rem; font-weight: 700; color: var(--text-dark);
}
.card-body { padding: 20px 22px; }

/* ── Section title ── */
.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem; font-weight: 700;
  color: var(--text-dark); margin-bottom: 14px;
}

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif; font-size: 0.83rem; font-weight: 600;
  border: none; cursor: pointer; transition: all 0.18s;
  text-decoration: none; white-space: nowrap;
}
.btn-primary { background: var(--amber); color: var(--green-dark); }
.btn-primary:hover { background: var(--amber-light); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(232,160,32,0.3); }
.btn-green { background: var(--green-mid); color: white; }
.btn-green:hover { background: var(--green-light); transform: translateY(-1px); }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-mid); }
.btn-outline:hover { background: var(--green-pale); border-color: var(--green-light); }
.btn-danger { background: var(--red-pale); color: var(--red); border: 1.5px solid rgba(201,64,64,0.2); }
.btn-danger:hover { background: rgba(201,64,64,0.12); }
.btn-sm { padding: 5px 12px; font-size: 0.76rem; }
.btn-full { width: 100%; justify-content: center; padding: 12px; }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 20px;
  font-size: 0.7rem; font-weight: 700;
}
.badge-success { background: rgba(45,90,27,0.1); color: var(--green-mid); }
.badge-warning { background: rgba(232,160,32,0.12); color: #9a6800; }
.badge-danger  { background: rgba(201,64,64,0.1); color: var(--red); }
.badge-info    { background: rgba(58,123,213,0.1); color: var(--blue); }
.badge-grey    { background: rgba(0,0,0,0.06); color: var(--text-light); }

/* ── Table ── */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  text-align: left; font-size: 0.68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--text-light); padding: 10px 20px;
  background: var(--cream); border-bottom: 1px solid var(--border);
}
.data-table td {
  padding: 13px 20px; font-size: 0.85rem; color: var(--text-mid);
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover td { background: var(--green-xpale); }

/* ── Form ── */
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 0.78rem; font-weight: 600;
  color: var(--text-mid); margin-bottom: 6px;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%; padding: 10px 14px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif; font-size: 0.875rem;
  color: var(--text-dark); background: var(--cream);
  outline: none; transition: border-color 0.18s, box-shadow 0.18s;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: var(--green-light);
  box-shadow: 0 0 0 3px rgba(74,124,47,0.1);
  background: white;
}
.form-group textarea { resize: vertical; min-height: 90px; }
.form-group input:disabled { opacity: 0.5; cursor: not-allowed; background: var(--green-pale); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .span2 { grid-column: span 2; }

/* ── Toggle switch ── */
.toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0; background: var(--border);
  border-radius: 24px; cursor: pointer; transition: background 0.2s;
}
.toggle-slider::before {
  content: ''; position: absolute;
  width: 18px; height: 18px; border-radius: 50%;
  background: white; top: 3px; left: 3px;
  transition: transform 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.toggle input:checked + .toggle-slider { background: var(--green-mid); }
.toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

/* ── Empty state ── */
.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--text-light);
}
.empty-state .es-icon { font-size: 3rem; margin-bottom: 14px; opacity: 0.5; }
.empty-state h3 { font-size: 1.05rem; font-weight: 700; color: var(--text-mid); margin-bottom: 6px; }
.empty-state p  { font-size: 0.85rem; margin-bottom: 20px; }

/* ── Filter bar ── */
.filter-bar {
  display: flex; gap: 10px; flex-wrap: wrap;
  align-items: center; margin-bottom: 22px;
}
.filter-bar select,
.filter-bar input[type="text"] {
  padding: 8px 14px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: var(--white);
  font-family: 'DM Sans', sans-serif; font-size: 0.83rem;
  color: var(--text-dark); outline: none;
  transition: border-color 0.18s;
}
.filter-bar select:focus,
.filter-bar input:focus { border-color: var(--green-light); }

/* ── Tabs ── */
.tabs {
  display: flex; gap: 4px;
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 4px; width: fit-content;
  margin-bottom: 22px;
}
.tab {
  padding: 7px 18px; border-radius: 7px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem; font-weight: 600;
  color: var(--text-light); border: none; background: none;
  cursor: pointer; transition: all 0.15s;
}
.tab.active { background: var(--amber); color: var(--green-dark); }
.tab:hover:not(.active) { background: var(--green-pale); color: var(--text-dark); }

/* ── Chip ── */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 12px; border-radius: 20px;
  font-size: 0.75rem; font-weight: 600;
  background: var(--green-pale); color: var(--green-mid);
  border: 1px solid var(--border);
}

/* ── Divider ── */
hr.divider {
  border: none; border-top: 1px solid var(--border); margin: 20px 0;
}

/* ── Row util ── */
.row { display: flex; gap: 16px; align-items: center; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }

/* ── Stagger animation for lists ── */
.stagger > * {
  animation: slideUp 0.3s ease both;
}
.stagger > *:nth-child(1) { animation-delay: 0.04s; }
.stagger > *:nth-child(2) { animation-delay: 0.08s; }
.stagger > *:nth-child(3) { animation-delay: 0.12s; }
.stagger > *:nth-child(4) { animation-delay: 0.16s; }
.stagger > *:nth-child(5) { animation-delay: 0.20s; }
.stagger > *:nth-child(6) { animation-delay: 0.24s; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

</style>
<style>
  .search-hero {
    background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%);
    border-radius: var(--radius); padding: 28px 28px 24px;
    margin-bottom: 24px; position: relative; overflow: hidden;
  }
  .search-hero::after {
    content: '🌾'; position: absolute; right: 24px; bottom: -8px;
    font-size: 5rem; opacity: 0.12;
  }
  .search-hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem; font-weight: 900; color: white; margin-bottom: 4px;
  }
  .search-hero p { font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-bottom: 18px; }

  .search-bar {
    display: flex; gap: 10px;
  }
  .search-bar input {
    flex: 1; padding: 10px 16px; border-radius: 10px; border: none;
    background: rgba(255,255,255,0.12); color: white;
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none;
    backdrop-filter: blur(4px);
    transition: background 0.2s;
  }
  .search-bar input::placeholder { color: rgba(255,255,255,0.45); }
  .search-bar input:focus { background: rgba(255,255,255,0.2); }

  .filter-chips {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px;
  }
  .filter-chip {
    padding: 6px 16px; border-radius: 20px; border: 1.5px solid var(--border);
    background: var(--white); color: var(--text-mid);
    font-size: 0.8rem; font-weight: 600; cursor: pointer;
    transition: all 0.15s; font-family: 'DM Sans', sans-serif;
  }
  .filter-chip.active {
    background: var(--green-dark); color: var(--amber);
    border-color: var(--green-dark);
  }
  .filter-chip:hover:not(.active) { background: var(--green-pale); border-color: var(--green-light); }

  .listings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .listing-card {
    background: var(--white); border-radius: var(--radius);
    border: 1.5px solid var(--border);
    overflow: hidden; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    box-shadow: var(--shadow-sm);
  }
  .listing-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: var(--green-light);
  }

  .listing-thumb {
    height: 120px; background: var(--green-pale);
    display: flex; align-items: center; justify-content: center;
    font-size: 3.5rem; position: relative;
  }
  .listing-thumb .organic-tag {
    position: absolute; top: 10px; left: 10px;
    background: var(--green-dark); color: var(--amber-light);
    font-size: 0.6rem; font-weight: 700; padding: 3px 8px; border-radius: 6px;
    letter-spacing: 0.05em;
  }
  .save-btn {
    position: absolute; top: 10px; right: 10px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.9); border: none; cursor: pointer;
    font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: transform 0.15s, background 0.15s;
  }
  .save-btn:hover { transform: scale(1.15); background: white; }
  .save-btn.saved { background: var(--amber-pale); }

  .listing-body { padding: 14px 16px 16px; }
  .listing-name { font-size: 0.95rem; font-weight: 700; color: var(--text-dark); margin-bottom: 2px; }
  .listing-farmer { font-size: 0.74rem; color: var(--text-light); margin-bottom: 10px; }
  .listing-footer {
    display: flex; align-items: center; justify-content: space-between;
  }
  .listing-price { font-size: 1rem; font-weight: 700; color: var(--green-mid); }
  .listing-stock { font-size: 0.7rem; color: var(--text-light); }
  .order-btn {
    padding: 6px 14px; border-radius: 7px;
    background: var(--amber); color: var(--green-dark);
    font-size: 0.78rem; font-weight: 700; border: none; cursor: pointer;
    transition: all 0.15s;
  }
  .order-btn:hover { background: var(--amber-light); transform: translateY(-1px); }

  .result-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .result-bar span { font-size: 0.82rem; color: var(--text-light); }

  .sort-select {
    padding: 6px 12px; border-radius: 8px;
    border: 1.5px solid var(--border); background: var(--white);
    font-family: 'DM Sans', sans-serif; font-size: 0.8rem;
    color: var(--text-dark); outline: none;
  }
</style>
</head>
<body>

<div class="search-hero">
  <h1>Browse Fresh Produce</h1>
  <p>Direct from local farmers in your area</p>
  <div class="search-bar">
    <input type="text" id="q" placeholder="🔍  Search crops, farmers, locations..." oninput="filter()">
    <button class="btn btn-primary" onclick="filter()">Search</button>
  </div>
</div>

<div class="filter-chips stagger" id="chips">
  <button class="filter-chip active" onclick="setChip(this,'')"        >🌿 All</button>
  <button class="filter-chip"        onclick="setChip(this,'Vegetables')">🥦 Vegetables</button>
  <button class="filter-chip"        onclick="setChip(this,'Fruit')"    >🍓 Fruit</button>
  <button class="filter-chip"        onclick="setChip(this,'Dairy')"    >🥛 Dairy</button>
  <button class="filter-chip"        onclick="setChip(this,'Grain')"    >🌾 Grain</button>
</div>

<div class="result-bar">
  <span id="result-count"></span>
  <select class="sort-select" id="sort" onchange="filter()">
    <option value="">Sort: Default</option>
    <option value="asc">Price: Low → High</option>
    <option value="desc">Price: High → Low</option>
    <option value="stock">Most Stock</option>
  </select>
</div>

<div class="listings-grid stagger" id="grid"></div>

<script>
const DATA = [
  { id:1,  emoji:'🍅', name:'Organic Tomatoes',  farmer:'Jan de Boer',    loc:'Lelystad',  cat:'Vegetables', price:2.40, unit:'kg', stock:120, organic:true,  saved:false },
  { id:2,  emoji:'🍓', name:'Strawberries',       farmer:'Jan de Boer',    loc:'Lelystad',  cat:'Fruit',      price:4.50, unit:'kg', stock:40,  organic:true,  saved:true  },
  { id:3,  emoji:'🥦', name:'Broccoli',           farmer:'Anja Smits',     loc:'Almere',    cat:'Vegetables', price:1.80, unit:'kg', stock:60,  organic:false, saved:false },
  { id:4,  emoji:'🥕', name:'Carrots',            farmer:'Klaas Hoekstra', loc:'Dronten',   cat:'Vegetables', price:1.20, unit:'kg', stock:200, organic:false, saved:false },
  { id:5,  emoji:'🥛', name:'Fresh Whole Milk',   farmer:'Boer Bert',      loc:'Zeewolde',  cat:'Dairy',      price:0.90, unit:'L',  stock:80,  organic:true,  saved:false },
  { id:6,  emoji:'🫐', name:'Blueberries',        farmer:'Klaas Hoekstra', loc:'Dronten',   cat:'Fruit',      price:7.00, unit:'kg', stock:15,  organic:true,  saved:false },
  { id:7,  emoji:'🥔', name:'Potatoes',           farmer:'Jan de Boer',    loc:'Lelystad',  cat:'Vegetables', price:0.70, unit:'kg', stock:300, organic:false, saved:false },
  { id:8,  emoji:'🌾', name:'Wheat Flour',        farmer:'Anja Smits',     loc:'Almere',    cat:'Grain',      price:1.10, unit:'kg', stock:500, organic:false, saved:false },
  { id:9,  emoji:'🧅', name:'Onions',             farmer:'Boer Bert',      loc:'Zeewolde',  cat:'Vegetables', price:0.80, unit:'kg', stock:150, organic:false, saved:false },
  { id:10, emoji:'🍏', name:'Green Apples',       farmer:'Klaas Hoekstra', loc:'Dronten',   cat:'Fruit',      price:2.20, unit:'kg', stock:90,  organic:true,  saved:false },
  { id:11, emoji:'🫑', name:'Green Peppers',      farmer:'Anja Smits',     loc:'Almere',    cat:'Vegetables', price:2.00, unit:'kg', stock:45,  organic:false, saved:false },
  { id:12, emoji:'🍯', name:'Raw Honey',          farmer:'Boer Bert',      loc:'Zeewolde',  cat:'Dairy',      price:8.50, unit:'jar',stock:30,  organic:true,  saved:false },
];

let activeCat = '';

function setChip(el, cat) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeCat = cat;
  filter();
}

function filter() {
  const q    = document.getElementById('q').value.toLowerCase();
  const sort = document.getElementById('sort').value;
  let list = DATA.filter(d => {
    const matchQ = !q || d.name.toLowerCase().includes(q) || d.farmer.toLowerCase().includes(q) || d.loc.toLowerCase().includes(q);
    const matchC = !activeCat || d.cat === activeCat;
    return matchQ && matchC;
  });
  if (sort === 'asc')   list.sort((a,b) => a.price - b.price);
  if (sort === 'desc')  list.sort((a,b) => b.price - a.price);
  if (sort === 'stock') list.sort((a,b) => b.stock - a.stock);
  document.getElementById('result-count').textContent = `${list.length} listing${list.length!==1?'s':''} found`;
  render(list);
}

function render(list) {
  document.getElementById('grid').innerHTML = list.length === 0
    ? `<div class="empty-state" style="grid-column:1/-1">
        <div class="es-icon">🌿</div>
        <h3>No listings found</h3>
        <p>Try a different search or category.</p>
       </div>`
    : list.map(d => `
      <div class="listing-card">
        <div class="listing-thumb">
          ${d.emoji}
          ${d.organic ? `<span class="organic-tag">ORGANIC</span>` : ''}
          <button class="save-btn ${d.saved?'saved':''}" onclick="toggleSave(${d.id},this)" title="Save">${d.saved?'⭐':'☆'}</button>
        </div>
        <div class="listing-body">
          <div class="listing-name">${d.name}</div>
          <div class="listing-farmer">🧑‍🌾 ${d.farmer} · 📍 ${d.loc}</div>
          <div class="listing-footer">
            <div>
              <div class="listing-price">€${d.price.toFixed(2)}<span style="font-size:0.72rem;font-weight:400;color:var(--text-light)"> /${d.unit}</span></div>
              <div class="listing-stock">${d.stock} ${d.unit} available</div>
            </div>
            <button class="order-btn" onclick="order('${d.name}')">Order</button>
          </div>
        </div>
      </div>`).join('');
}

function toggleSave(id, btn) {
  const d = DATA.find(x => x.id === id);
  d.saved = !d.saved;
  btn.textContent = d.saved ? '⭐' : '☆';
  btn.classList.toggle('saved', d.saved);
}
