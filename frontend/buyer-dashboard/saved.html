<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saved Listings</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&display=swap');

/* ═══════════════════════════════════════════
   FARMVILLE — Page CSS (loads inside iframe)
   All pages share this file via <link>
═══════════════════════════════════════════ */

:root {
  --green-dark:  #1a3a1a;
  --green-mid:   #2d5a1b;
  --green-light: #4a7c2f;
  --green-pale:  #e8f0e0;
  --green-xpale: #f2f7ee;
  --amber:       #e8a020;
  --amber-light: #f5c842;
  --amber-pale:  #fdf3e0;
  --cream:       #faf6ed;
  --white:       #ffffff;
  --text-dark:   #1a2a0a;
  --text-mid:    #3a4a2a;
  --text-light:  #6a7a5a;
  --border:      #d4e0c4;
  --red:         #c94040;
  --red-pale:    #fdf0f0;
  --blue:        #3a7bd5;
  --blue-pale:   #eef4fd;
  --shadow-sm:   0 1px 4px rgba(26,58,26,0.06);
  --shadow-md:   0 4px 20px rgba(26,58,26,0.10);
  --shadow-lg:   0 12px 40px rgba(26,58,26,0.14);
  --radius:      14px;
  --radius-sm:   8px;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html {
  height: 100%;
  overflow-x: hidden;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--green-xpale);
  color: var(--text-dark);
  min-height: 100%;
  padding: 28px 32px 40px;
  animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Page header ── */
.page-header {
  margin-bottom: 28px;
}
.page-header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.75rem; font-weight: 900;
  color: var(--text-dark); line-height: 1.1;
  margin-bottom: 4px;
}
.page-header p {
  font-size: 0.85rem; color: var(--text-light);
}

/* ── Stat grid ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.stat-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 20px 22px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  position: relative; overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

.stat-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.stat-card.green::before { background: linear-gradient(90deg, var(--green-mid), var(--green-light)); }
.stat-card.amber::before { background: linear-gradient(90deg, var(--amber), var(--amber-light)); }
.stat-card.blue::before  { background: linear-gradient(90deg, var(--blue), #6ba3e8); }
.stat-card.red::before   { background: linear-gradient(90deg, var(--red), #e07070); }

.stat-icon {
  font-size: 1.5rem; margin-bottom: 10px; display: block;
}
.stat-label {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--text-light); margin-bottom: 4px;
}
.stat-value {
  font-family: 'Playfair Display', serif;
  font-size: 2rem; font-weight: 900; color: var(--text-dark);
  line-height: 1; margin-bottom: 4px;
}
.stat-sub { font-size: 0.75rem; color: var(--text-light); }
.stat-sub.up   { color: var(--green-mid); }
.stat-sub.down { color: var(--red); }

/* ── Card ── */
.card {
  background: var(--white);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  margin-bottom: 22px;
  overflow: hidden;
}

.card-header {
  padding: 16px 22px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--cream);
}
.card-header h2 {
  font-size: 0.95rem; font-weight: 700; color: var(--text-dark);
}
.card-body { padding: 20px 22px; }

/* ── Section title ── */
.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem; font-weight: 700;
  color: var(--text-dark); margin-bottom: 14px;
}

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif; font-size: 0.83rem; font-weight: 600;
  border: none; cursor: pointer; transition: all 0.18s;
  text-decoration: none; white-space: nowrap;
}
.btn-primary { background: var(--amber); color: var(--green-dark); }
.btn-primary:hover { background: var(--amber-light); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(232,160,32,0.3); }
.btn-green { background: var(--green-mid); color: white; }
.btn-green:hover { background: var(--green-light); transform: translateY(-1px); }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-mid); }
.btn-outline:hover { background: var(--green-pale); border-color: var(--green-light); }
.btn-danger { background: var(--red-pale); color: var(--red); border: 1.5px solid rgba(201,64,64,0.2); }
.btn-danger:hover { background: rgba(201,64,64,0.12); }
.btn-sm { padding: 5px 12px; font-size: 0.76rem; }
.btn-full { width: 100%; justify-content: center; padding: 12px; }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 20px;
  font-size: 0.7rem; font-weight: 700;
}
.badge-success { background: rgba(45,90,27,0.1); color: var(--green-mid); }
.badge-warning { background: rgba(232,160,32,0.12); color: #9a6800; }
.badge-danger  { background: rgba(201,64,64,0.1); color: var(--red); }
.badge-info    { background: rgba(58,123,213,0.1); color: var(--blue); }
.badge-grey    { background: rgba(0,0,0,0.06); color: var(--text-light); }

/* ── Table ── */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  text-align: left; font-size: 0.68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--text-light); padding: 10px 20px;
  background: var(--cream); border-bottom: 1px solid var(--border);
}
.data-table td {
  padding: 13px 20px; font-size: 0.85rem; color: var(--text-mid);
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover td { background: var(--green-xpale); }

/* ── Form ── */
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 0.78rem; font-weight: 600;
  color: var(--text-mid); margin-bottom: 6px;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%; padding: 10px 14px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif; font-size: 0.875rem;
  color: var(--text-dark); background: var(--cream);
  outline: none; transition: border-color 0.18s, box-shadow 0.18s;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: var(--green-light);
  box-shadow: 0 0 0 3px rgba(74,124,47,0.1);
  background: white;
}
.form-group textarea { resize: vertical; min-height: 90px; }
.form-group input:disabled { opacity: 0.5; cursor: not-allowed; background: var(--green-pale); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .span2 { grid-column: span 2; }

/* ── Toggle switch ── */
.toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0; background: var(--border);
  border-radius: 24px; cursor: pointer; transition: background 0.2s;
}
.toggle-slider::before {
  content: ''; position: absolute;
  width: 18px; height: 18px; border-radius: 50%;
  background: white; top: 3px; left: 3px;
  transition: transform 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.toggle input:checked + .toggle-slider { background: var(--green-mid); }
.toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

/* ── Empty state ── */
.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--text-light);
}
.empty-state .es-icon { font-size: 3rem; margin-bottom: 14px; opacity: 0.5; }
.empty-state h3 { font-size: 1.05rem; font-weight: 700; color: var(--text-mid); margin-bottom: 6px; }
.empty-state p  { font-size: 0.85rem; margin-bottom: 20px; }

/* ── Filter bar ── */
.filter-bar {
  display: flex; gap: 10px; flex-wrap: wrap;
  align-items: center; margin-bottom: 22px;
}
.filter-bar select,
.filter-bar input[type="text"] {
  padding: 8px 14px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: var(--white);
  font-family: 'DM Sans', sans-serif; font-size: 0.83rem;
  color: var(--text-dark); outline: none;
  transition: border-color 0.18s;
}
.filter-bar select:focus,
.filter-bar input:focus { border-color: var(--green-light); }

/* ── Tabs ── */
.tabs {
  display: flex; gap: 4px;
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 4px; width: fit-content;
  margin-bottom: 22px;
}
.tab {
  padding: 7px 18px; border-radius: 7px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem; font-weight: 600;
  color: var(--text-light); border: none; background: none;
  cursor: pointer; transition: all 0.15s;
}
.tab.active { background: var(--amber); color: var(--green-dark); }
.tab:hover:not(.active) { background: var(--green-pale); color: var(--text-dark); }

/* ── Chip ── */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 12px; border-radius: 20px;
  font-size: 0.75rem; font-weight: 600;
  background: var(--green-pale); color: var(--green-mid);
  border: 1px solid var(--border);
}

/* ── Divider ── */
hr.divider {
  border: none; border-top: 1px solid var(--border); margin: 20px 0;
}

/* ── Row util ── */
.row { display: flex; gap: 16px; align-items: center; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }

/* ── Stagger animation for lists ── */
.stagger > * {
  animation: slideUp 0.3s ease both;
}
.stagger > *:nth-child(1) { animation-delay: 0.04s; }
.stagger > *:nth-child(2) { animation-delay: 0.08s; }
.stagger > *:nth-child(3) { animation-delay: 0.12s; }
.stagger > *:nth-child(4) { animation-delay: 0.16s; }
.stagger > *:nth-child(5) { animation-delay: 0.20s; }
.stagger > *:nth-child(6) { animation-delay: 0.24s; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

</style>
<style>
  .saved-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .saved-card {
    background: var(--white); border-radius: var(--radius);
    border: 1.5px solid var(--border); overflow: hidden;
    box-shadow: var(--shadow-sm); position: relative;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .saved-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }

  .saved-thumb {
    height: 100px; background: var(--green-pale);
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; position: relative;
  }
  .price-change {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(232,160,32,0.92); color: var(--green-dark);
    font-size: 0.62rem; font-weight: 700; padding: 2px 10px; border-radius: 10px;
    white-space: nowrap;
  }
  .remove-btn {
    position: absolute; top: 8px; right: 8px;
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(201,64,64,0.1); border: none; cursor: pointer;
    color: var(--red); font-size: 0.8rem;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .remove-btn:hover { background: rgba(201,64,64,0.2); }

  .saved-body { padding: 14px 16px 16px; }
  .saved-name { font-size: 0.95rem; font-weight: 700; color: var(--text-dark); margin-bottom: 2px; }
  .saved-farmer { font-size: 0.74rem; color: var(--text-light); margin-bottom: 10px; }
  .saved-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .saved-price { font-size: 1rem; font-weight: 700; color: var(--green-mid); }
  .saved-stock { font-size: 0.7rem; color: var(--text-light); }

  .summary-row {
    display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px;
  }
  .summary-pill {
    background: var(--white); border: 1.5px solid var(--border);
    border-radius: 10px; padding: 10px 20px;
    display: flex; flex-direction: column; gap: 2px;
    box-shadow: var(--shadow-sm);
  }
  .summary-pill span { font-size: 0.7rem; color: var(--text-light); font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; }
  .summary-pill strong { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 900; color: var(--text-dark); }
</style>
</head>
<body>

<div class="page-header row between">
  <div>
    <h1>⭐ Saved Listings</h1>
    <p>Your bookmarked produce — get notified on price drops</p>
  </div>
  <a href="browse.html" class="btn btn-primary">+ Browse More</a>
</div>

<div class="summary-row stagger">
  <div class="summary-pill"><span>Saved</span><strong id="cnt-saved">—</strong></div>
  <div class="summary-pill"><span>Price Drops</span><strong id="cnt-drops">—</strong></div>
  <div class="summary-pill"><span>Farmers</span><strong id="cnt-farmers">—</strong></div>
</div>

<div class="saved-grid stagger" id="saved-grid"></div>

<script>
let saved = [
  { id:1, emoji:'🍓', name:'Strawberries',    farmer:'Jan de Boer',    loc:'Lelystad', price:4.50, unit:'kg', stock:40,  dropped:true,  oldPrice:5.00 },
  { id:2, emoji:'🫐', name:'Blueberries',     farmer:'Klaas Hoekstra', loc:'Dronten',  price:7.00, unit:'kg', stock:15,  dropped:false, oldPrice:0    },
  { id:3, emoji:'🥦', name:'Broccoli',        farmer:'Anja Smits',     loc:'Almere',   price:1.80, unit:'kg', stock:60,  dropped:true,  oldPrice:2.20 },
  { id:4, emoji:'🥛', name:'Fresh Whole Milk',farmer:'Boer Bert',      loc:'Zeewolde', price:0.90, unit:'L',  stock:80,  dropped:false, oldPrice:0    },
  { id:5, emoji:'🍏', name:'Green Apples',    farmer:'Klaas Hoekstra', loc:'Dronten',  price:2.20, unit:'kg', stock:90,  dropped:false, oldPrice:0    },
  { id:6, emoji:'🧅', name:'Onions',          farmer:'Boer Bert',      loc:'Zeewolde', price:0.80, unit:'kg', stock:150, dropped:false, oldPrice:0    },
  { id:7, emoji:'🍅', name:'Organic Tomatoes',farmer:'Jan de Boer',    loc:'Lelystad', price:2.40, unit:'kg', stock:120, dropped:false, oldPrice:0    },
];

function render() {
  const drops   = saved.filter(s => s.dropped).length;
  const farmers = [...new Set(saved.map(s => s.farmer))].length;
  document.getElementById('cnt-saved').textContent   = saved.length;
  document.getElementById('cnt-drops').textContent   = drops;
  document.getElementById('cnt-farmers').textContent = farmers;

  const grid = document.getElementById('saved-grid');
  if (!saved.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="es-icon">⭐</div>
      <h3>Nothing saved yet</h3>
      <p>Star any listing while browsing to save it here.</p>
      <a href="browse.html" class="btn btn-primary">Browse Listings</a>
    </div>`;
    return;
  }
  grid.innerHTML = saved.map(s => `
    <div class="saved-card">
      <button class="remove-btn" onclick="remove(${s.id})" title="Remove">✕</button>
      <div class="saved-thumb">
        ${s.emoji}
        ${s.dropped ? `<div class="price-change">↓ Was €${s.oldPrice.toFixed(2)}</div>` : ''}
      </div>
      <div class="saved-body">
        <div class="saved-name">${s.name}</div>
        <div class="saved-farmer">🧑‍🌾 ${s.farmer} · 📍 ${s.loc}</div>
        <div class="saved-row">
          <div>
            <div class="saved-price">€${s.price.toFixed(2)} / ${s.unit}</div>
            <div class="saved-stock">${s.stock} ${s.unit} left</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-primary btn-sm" onclick="order('${s.name}')">Order</button>
            <button class="btn btn-outline btn-sm" onclick="remove(${s.id})">Remove</button>
          </div>
        </div>
      </div>
    </div>`).join('');
}

function remove(id) { saved = saved.filter(s => s.id !== id); render(); }
function order(name) { alert(`Order initiated for ${name}!`); }

render();
</script>
</body>
</html>
