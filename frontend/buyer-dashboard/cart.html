<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--green-dark:#1a3a1a;--green-mid:#2d5a1b;--green-light:#4a7c2f;--green-pale:#e8f0e0;--amber:#e8a020;--amber-light:#f5c842;--cream:#faf6ed;--white:#fff;--text-dark:#1a2a0a;--text-mid:#3a4a2a;--text-light:#6a7a5a;--border:#d4e0c4;--red:#d94f4f;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;font-family:'DM Sans',sans-serif;background:#f0f4ea;color:var(--text-dark);}
  body{display:flex;flex-direction:column;}
  .topbar{flex-shrink:0;background:var(--white);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(0,0,0,0.05);}
  .topbar h2{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;}
  .topbar p{font-size:0.8rem;color:var(--text-light);margin-top:2px;}
  .content{flex:1;overflow-y:auto;padding:24px 32px;}
  .cart-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;}

  /* CART ITEMS */
  .cart-items{display:flex;flex-direction:column;gap:12px;}
  .cart-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 5px rgba(0,0,0,0.04);}
  .cart-icon{width:50px;height:50px;border-radius:12px;background:var(--green-pale);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;}
  .cart-info{flex:1;min-width:0;}
  .cart-info h4{font-size:0.92rem;font-weight:700;margin-bottom:3px;}
  .cart-info .farmer{font-size:0.74rem;color:var(--text-light);}
  .cart-info .price{font-size:0.85rem;color:var(--green-light);font-weight:600;margin-top:4px;}
  .cart-right{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .qty-control{display:flex;align-items:center;gap:8px;}
  .qty-btn{width:30px;height:30px;border:1.5px solid var(--border);border-radius:8px;background:var(--cream);cursor:pointer;font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all 0.2s;font-family:'DM Sans',sans-serif;}
  .qty-btn:hover{background:var(--green-pale);border-color:var(--green-light);}
  .qty-val{width:36px;text-align:center;font-weight:700;font-size:0.9rem;}
  .item-total{font-size:0.95rem;font-weight:700;min-width:70px;text-align:right;}
  .btn-remove-item{background:none;border:none;cursor:pointer;color:var(--text-light);font-size:1rem;padding:4px;transition:color 0.2s;}
  .btn-remove-item:hover{color:var(--red);}

  /* SUMMARY CARD */
  .summary-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 1px 6px rgba(0,0,0,0.04);position:sticky;top:0;}
  .summary-card h3{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .sum-row{display:flex;justify-content:space-between;padding:8px 0;font-size:0.85rem;border-bottom:1px solid var(--border);}
  .sum-row:last-of-type{border-bottom:none;}
  .sum-row .lbl{color:var(--text-mid);}
  .sum-row .val{font-weight:600;}
  .sum-total{display:flex;justify-content:space-between;padding:14px 0 0;font-size:1rem;font-weight:700;border-top:2px solid var(--border);margin-top:4px;}
  .sum-total .val{color:var(--green-light);font-size:1.1rem;}
  .btn-checkout{width:100%;padding:13px;background:var(--amber);color:var(--green-dark);border:none;border-radius:12px;font-weight:700;font-size:0.9rem;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:16px;transition:background 0.2s;}
  .btn-checkout:hover{background:var(--amber-light);}
  .btn-checkout:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-clear{width:100%;padding:10px;background:var(--cream);border:1.5px solid var(--border);border-radius:10px;font-weight:600;font-size:0.82rem;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px;transition:all 0.2s;}
  .btn-clear:hover{background:#fde8e8;border-color:var(--red);color:var(--red);}
  .note{font-size:0.72rem;color:var(--text-light);text-align:center;margin-top:12px;line-height:1.5;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-light);}
  .empty-state .ei{font-size:3.5rem;margin-bottom:14px;}
  .empty-state h3{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--text-dark);margin-bottom:8px;}
  .btn-browse{padding:11px 28px;background:var(--amber);color:var(--green-dark);border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:14px;}

  /* Checkout result modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:none;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--white);border-radius:20px;padding:32px;width:90%;max-width:380px;text-align:center;}
  .modal .result-icon{font-size:3rem;margin-bottom:14px;}
  .modal h3{font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:8px;}
  .modal p{font-size:0.85rem;color:var(--text-mid);margin-bottom:20px;}
  .modal .btn-done{padding:11px 32px;background:var(--amber);color:var(--green-dark);border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;}
</style>
</head>
<body>
<header class="topbar">
  <div><h2>🛒 My Cart</h2><p>Review your items before ordering</p></div>
</header>
<div class="content">
  <div id="cart-root"></div>
</div>

<!-- Result modal -->
<div class="modal-overlay" id="result-modal">
  <div class="modal">
    <div class="result-icon" id="r-icon">✅</div>
    <h3 id="r-title">Orders placed!</h3>
    <p  id="r-body">Your orders have been sent to the farmers.</p>
    <button class="btn-done" onclick="closeResult()">View My Orders</button>
  </div>
</div>

<script src="app.js"></script>
<script>
  // Cart stored in localStorage: [{ listing_id, product_name, farmer_name, price, unit, stock, qty }]
  const CART_KEY = `fv_cart_${buyerId()}`;

  function getCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch { return []; }
  }

  function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }

  function renderCart() {
    const cart  = getCart();
    const root  = document.getElementById('cart-root');

    if (!cart.length) {
      root.innerHTML = `
        <div class="empty-state">
          <div class="ei">🛒</div>
          <h3>Your cart is empty</h3>
          <p>Browse listings and add items to your cart.</p>
          <button class="btn-browse" onclick="navTo('browse.html')">Browse Listings</button>
        </div>`;
      return;
    }

    const subtotal = cart.reduce((s,i) => s + i.price * i.qty, 0);
    const count    = cart.reduce((s,i) => s + i.qty, 0);
    const emojis   = {'rice':'🌾','corn':'🌽','eggplant':'🍆','tomato':'🍅','onion':'🧅','garlic':'🧄','carrot':'🥕','pechay':'🥬','default':'🌿'};
    function getEmoji(name) { const n=name.toLowerCase(); for(const[k,v] of Object.entries(emojis)) if(n.includes(k)) return v; return emojis.default; }

    root.innerHTML = `
      <div class="cart-layout">
        <div class="cart-items" id="cart-items">
          ${cart.map((item,idx) => `
            <div class="cart-card">
              <div class="cart-icon">${getEmoji(item.product_name)}</div>
              <div class="cart-info">
                <h4>${item.product_name}</h4>
                <div class="farmer">👨‍🌾 ${item.farmer_name}</div>
                <div class="price">₱${parseFloat(item.price).toFixed(2)} / ${item.unit}</div>
              </div>
              <div class="cart-right">
                <div class="qty-control">
                  <button class="qty-btn" onclick="changeQty(${idx},-1)">−</button>
                  <span class="qty-val">${item.qty}</span>
                  <button class="qty-btn" onclick="changeQty(${idx},1)">+</button>
                </div>
                <span class="item-total">₱${(item.price * item.qty).toLocaleString('en-PH',{minimumFractionDigits:2})}</span>
                <button class="btn-remove-item" onclick="removeItem(${idx})" title="Remove">✕</button>
              </div>
            </div>`).join('')}
        </div>
        <div class="summary-card">
          <h3>🧾 Order Summary</h3>
          <div class="sum-row"><span class="lbl">Items (${cart.length})</span><span class="val">${cart.length}</span></div>
          <div class="sum-row"><span class="lbl">Total Qty</span><span class="val">${count}</span></div>
          <div class="sum-total"><span>Total</span><span class="val">₱${subtotal.toLocaleString('en-PH',{minimumFractionDigits:2})}</span></div>
          <button class="btn-checkout" id="checkout-btn" onclick="checkout()">Place All Orders</button>
          <button class="btn-clear" onclick="clearCart()">🗑 Clear Cart</button>
          <p class="note">Each item will be placed as a separate order with the respective farmer.</p>
        </div>
      </div>`;
  }

  function changeQty(idx, delta) {
    const cart = getCart();
    cart[idx].qty = Math.max(1, Math.min(cart[idx].stock, cart[idx].qty + delta));
    saveCart(cart);
    renderCart();
  }

  function removeItem(idx) {
    const cart = getCart();
    cart.splice(idx, 1);
    saveCart(cart);
    renderCart();
    showToast('Item removed from cart');
  }

  function clearCart() {
    if (!confirm('Clear all items from your cart?')) return;
    saveCart([]);
    renderCart();
  }

  async function checkout() {
    const cart = getCart();
    const btn  = document.getElementById('checkout-btn');
    if (!cart.length) return;

    btn.disabled = true; btn.textContent = 'Placing orders...';

    const results = await Promise.all(cart.map(item =>
      apiFetch('place_order.php', {
        method: 'POST',
        body: JSON.stringify({ buyer_id: buyerId(), listing_id: item.listing_id, quantity: item.qty })
      })
    ));

    const failed  = results.filter(r => r.error);
    const success = results.filter(r => r.success);

    if (failed.length === 0) {
      saveCart([]);
      document.getElementById('r-icon').textContent  = '✅';
      document.getElementById('r-title').textContent = `${success.length} order${success.length>1?'s':''} placed!`;
      document.getElementById('r-body').textContent  = 'Your orders have been sent to the farmers.';
    } else if (success.length > 0) {
      // Partial success - remove successful items
      const newCart = cart.filter((_,i) => results[i].error);
      saveCart(newCart);
      document.getElementById('r-icon').textContent  = '⚠️';
      document.getElementById('r-title').textContent = `${success.length} placed, ${failed.length} failed`;
      document.getElementById('r-body').textContent  = failed.map(r => r.error).join(' · ');
    } else {
      btn.disabled = false; btn.textContent = 'Place All Orders';
      showToast(failed[0].error, 'error'); return;
    }

    document.getElementById('result-modal').classList.add('open');
    btn.disabled = false; btn.textContent = 'Place All Orders';
    renderCart();
  }

  function closeResult() {
    document.getElementById('result-modal').classList.remove('open');
    navTo('orders.html');
  }

  // Expose addToCart for browse page use (called via parent)
  window.addToCart = function(item) {
    const cart = getCart();
    const existing = cart.find(i => i.listing_id === item.listing_id);
    if (existing) {
      existing.qty = Math.min(existing.stock, existing.qty + (item.qty || 1));
    } else {
      cart.push({ ...item, qty: item.qty || 1 });
    }
    saveCart(cart);
    showToast(`${item.product_name} added to cart!`);
  };

  renderCart();
</script>
</body>
</html>
