<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disputes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--green-dark:#1a3a1a;--green-light:#4a7c2f;--green-pale:#e8f0e0;--amber:#e8a020;--cream:#faf6ed;--white:#fff;--text-dark:#1a2a0a;--text-mid:#3a4a2a;--text-light:#6a7a5a;--border:#d4e0c4;--red:#d94f4f;}
  *{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;font-family:'DM Sans',sans-serif;background:#f0f4ea;color:var(--text-dark);}
  body{display:flex;flex-direction:column;}
  .topbar{flex-shrink:0;background:var(--white);padding:16px 32px;border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(0,0,0,0.05);}
  .topbar h2{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;}
  .topbar p{font-size:0.8rem;color:var(--text-light);margin-top:2px;}
  .content{flex:1;overflow-y:auto;padding:24px 32px;}
  .info-box{background:rgba(58,123,213,0.08);border:1px solid rgba(58,123,213,0.2);border-radius:12px;padding:14px 18px;font-size:0.82rem;color:#1a3a6a;margin-bottom:20px;line-height:1.6;}
  .dispute-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:20px 24px;margin-bottom:14px;box-shadow:0 1px 5px rgba(0,0,0,0.04);}
  .d-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .d-id{font-size:0.78rem;color:var(--text-light);}
  .badge{display:inline-block;font-size:0.65rem;font-weight:700;padding:4px 10px;border-radius:8px;}
  .badge-open{background:rgba(232,160,32,0.15);color:#b07010;}.badge-resolved{background:rgba(74,124,47,0.12);color:#2d6a10;}.badge-in_review{background:rgba(58,123,213,0.12);color:#2a5da8;}
  .d-body h4{font-size:0.95rem;font-weight:700;margin-bottom:4px;}.d-body p{font-size:0.8rem;color:var(--text-light);margin-bottom:8px;}
  .d-reason{background:var(--cream);border-radius:8px;padding:10px 14px;font-size:0.82rem;color:var(--text-mid);border-left:3px solid var(--red);}
  .empty-state{text-align:center;padding:60px;color:var(--text-light);}
  .skeleton{background:linear-gradient(90deg,#e8f0e0 25%,#d4e0c4 50%,#e8f0e0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:12px;height:100px;margin-bottom:12px;}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<header class="topbar"><h2>⚖️ Disputes</h2><p>Disputes filed against your orders</p></header>
<div class="content">
  <div class="info-box">ℹ️ Disputes are filed by buyers when there is an issue with their order. Please respond promptly. Our admin team reviews all disputes within 24–48 hours.</div>
  <div id="disputes-list"><div class="skeleton"></div><div class="skeleton"></div></div>
</div>
<script src="app.js"></script>
<script>
  async function loadDisputes(){
    const list=document.getElementById('disputes-list');
    // Reuse disputes API - farmer sees disputes where they are the seller
    const data=await apiFetch(`disputes.php?buyer_id=${farmerId()}`); // will be empty for farmer — use direct query
    // For farmer, we fetch orders that are disputed
    const odata=await apiFetch(`farmer_orders.php?farmer_id=${farmerId()}&filter=history`);
    const disputed=(odata.orders||[]).filter(o=>o.status==='disputed');
    if(!disputed.length){list.innerHTML='<div class="empty-state">✅ No disputes filed against your orders.</div>';return;}
    const bm={open:'badge-open',resolved:'badge-resolved',in_review:'badge-in_review'};
    list.innerHTML=disputed.map(o=>`
      <div class="dispute-card">
        <div class="d-top"><span class="d-id">Order #${o.id} · ${formatDate(o.created_at)}</span><span class="badge badge-open">OPEN</span></div>
        <div class="d-body"><h4>${o.product_name}</h4><p>Buyer: <strong>${o.buyer_name}</strong> · ${formatMoney(o.total_amount)}</p>
          <div class="d-reason">💬 A dispute has been filed for this order. Please await admin review.</div>
        </div>
      </div>`).join('');
  }
  loadDisputes();
</script>
</body>
</html>
