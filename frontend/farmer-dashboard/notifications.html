<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--green-dark:#1a3a1a;--green-mid:#2d5a1b;--green-light:#4a7c2f;--green-pale:#e8f0e0;--amber:#e8a020;--amber-light:#f5c842;--cream:#faf6ed;--white:#fff;--text-dark:#1a2a0a;--text-mid:#3a4a2a;--text-light:#6a7a5a;--border:#d4e0c4;--red:#d94f4f;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;font-family:'DM Sans',sans-serif;background:#f0f4ea;color:var(--text-dark);}
  body{display:flex;flex-direction:column;}
  .topbar{flex-shrink:0;background:var(--white);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(0,0,0,0.05);}
  .topbar h2{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;}
  .topbar p{font-size:0.8rem;color:var(--text-light);margin-top:2px;}
  .content{flex:1;overflow-y:auto;padding:24px 32px;}
  .notif-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .notif-toolbar h3{font-size:0.9rem;font-weight:600;color:var(--text-mid);}
  .btn-mark-all{padding:7px 16px;background:var(--cream);border:1.5px solid var(--border);border-radius:9px;font-size:0.8rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s;}
  .btn-mark-all:hover{background:var(--green-pale);border-color:var(--green-light);}
  .notif-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:10px;display:flex;align-items:flex-start;gap:14px;box-shadow:0 1px 4px rgba(0,0,0,0.04);transition:all 0.2s;}
  .notif-card.unread{border-left:3px solid var(--amber);background:rgba(232,160,32,0.03);}
  .notif-card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,0.08);}
  .notif-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
  .notif-icon.order   {background:rgba(58,123,213,0.1);}
  .notif-icon.message {background:rgba(74,124,47,0.1);}
  .notif-icon.promo   {background:rgba(232,160,32,0.12);}
  .notif-icon.dispute {background:rgba(217,79,79,0.1);}
  .notif-icon.system  {background:rgba(100,100,100,0.1);}
  .notif-body{flex:1;}
  .notif-body h4{font-size:0.88rem;font-weight:700;margin-bottom:3px;}
  .notif-body p{font-size:0.8rem;color:var(--text-mid);line-height:1.5;}
  .notif-time{font-size:0.7rem;color:var(--text-light);flex-shrink:0;padding-top:2px;}
  .unread-dot{width:8px;height:8px;background:var(--amber);border-radius:50%;margin-top:6px;flex-shrink:0;}
  .filter-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .ftab{padding:6px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif;}
  .ftab.active{background:var(--amber);border-color:var(--amber);color:var(--green-dark);}
  .empty-state{text-align:center;padding:60px;color:var(--text-light);}
  .empty-state .ei{font-size:3rem;margin-bottom:12px;}
  .skeleton{background:linear-gradient(90deg,#e8f0e0 25%,#d4e0c4 50%,#e8f0e0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:12px;height:78px;margin-bottom:10px;}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<header class="topbar">
  <div><h2>🔔 Notifications</h2><p>Stay updated on your orders and activity</p></div>
</header>
<div class="content">
  <div class="notif-toolbar">
    <h3 id="unread-label">Loading...</h3>
    <button class="btn-mark-all" onclick="markAllRead()">✓ Mark all as read</button>
  </div>
  <div class="filter-tabs">
    <button class="ftab active" onclick="filterNotifs('all',this)">All</button>
    <button class="ftab" onclick="filterNotifs('order',this)">Orders</button>
    <button class="ftab" onclick="filterNotifs('message',this)">Messages</button>
    <button class="ftab" onclick="filterNotifs('promo',this)">Promos</button>
    <button class="ftab" onclick="filterNotifs('dispute',this)">Disputes</button>
  </div>
  <div id="notif-list">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
  let allNotifs   = [];
  let activeFilter = 'all';

  const iconMap  = { order:'📦', message:'💬', promo:'🎉', dispute:'⚖️', system:'🔔' };
  const classMap = { order:'order', message:'message', promo:'promo', dispute:'dispute', system:'system' };

  async function loadNotifications() {
    const data  = await apiFetch(`notifications.php?user_id=${buyerId()}`);
    allNotifs   = data.notifications || [];
    const unread = data.unread_count || 0;
    document.getElementById('unread-label').textContent =
      unread > 0 ? `${unread} unread notification${unread>1?'s':''}` : 'All caught up ✓';
    renderNotifs();
  }

  function filterNotifs(type, el) {
    activeFilter = type;
    document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderNotifs();
  }

  function renderNotifs() {
    const list = document.getElementById('notif-list');
    let notifs = activeFilter === 'all' ? allNotifs : allNotifs.filter(n => n.type === activeFilter);

    if (!notifs.length) {
      list.innerHTML = `<div class="empty-state"><div class="ei">🔔</div><p>No ${activeFilter === 'all' ? '' : activeFilter + ' '}notifications yet.</p></div>`;
      return;
    }

    list.innerHTML = notifs.map(n => `
      <div class="notif-card ${n.is_read ? '' : 'unread'}">
        <div class="notif-icon ${classMap[n.type]||'system'}">${iconMap[n.type]||'🔔'}</div>
        <div class="notif-body">
          <h4>${n.title || 'Notification'}</h4>
          <p>${n.body || ''}</p>
        </div>
        <span class="notif-time">${timeAgo(n.created_at)}</span>
        ${!n.is_read ? '<div class="unread-dot"></div>' : ''}
      </div>`).join('');
  }

  async function markAllRead() {
    await apiFetch(`notifications.php?user_id=${buyerId()}`, { method: 'POST' });
    showToast('All notifications marked as read');
    loadNotifications();
  }

  function timeAgo(dt) {
    if (!dt) return '';
    const diff = (Date.now() - new Date(dt)) / 1000;
    if (diff < 60)    return 'just now';
    if (diff < 3600)  return Math.floor(diff/60)   + 'm ago';
    if (diff < 86400) return Math.floor(diff/3600)  + 'h ago';
    return formatDate(dt);
  }

  loadNotifications();
</script>
</body>
</html>
