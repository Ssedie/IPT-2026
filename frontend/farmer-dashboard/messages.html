<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--green-dark:#1a3a1a;--green-mid:#2d5a1b;--green-light:#4a7c2f;--green-pale:#e8f0e0;--amber:#e8a020;--amber-light:#f5c842;--cream:#faf6ed;--white:#fff;--text-dark:#1a2a0a;--text-mid:#3a4a2a;--text-light:#6a7a5a;--border:#d4e0c4;--red:#d94f4f;--blue:#3a7bd5;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;font-family:'DM Sans',sans-serif;background:#f0f4ea;color:var(--text-dark);}
  body{display:flex;flex-direction:column;}

  .topbar{flex-shrink:0;background:var(--white);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(0,0,0,0.05);}
  .topbar h2{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;}
  .topbar p{font-size:0.8rem;color:var(--text-light);margin-top:2px;}

  .chat-layout{flex:1;display:flex;overflow:hidden;}

  /* SIDEBAR */
  .convo-list{width:300px;min-width:300px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  .convo-search{padding:14px 16px;border-bottom:1px solid var(--border);}
  .convo-search input{width:100%;padding:8px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.85rem;outline:none;background:var(--cream);}
  .convo-search input:focus{border-color:var(--green-light);}
  .convo-items{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  .convo-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.15s;}
  .convo-item:hover{background:var(--green-pale);}
  .convo-item.active{background:var(--green-pale);border-left:3px solid var(--amber);}
  .convo-avatar{width:42px;height:42px;border-radius:50%;background:var(--green-mid);display:flex;align-items:center;justify-content:center;color:white;font-size:1rem;font-weight:700;flex-shrink:0;}
  .convo-info{flex:1;min-width:0;}
  .convo-name{font-size:0.88rem;font-weight:600;color:var(--text-dark);}
  .convo-preview{font-size:0.74rem;color:var(--text-light);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .convo-time{font-size:0.68rem;color:var(--text-light);flex-shrink:0;}
  .unread-dot{width:8px;height:8px;background:var(--red);border-radius:50%;flex-shrink:0;}

  /* CHAT AREA */
  .chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .chat-header{padding:14px 20px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
  .chat-header-avatar{width:38px;height:38px;border-radius:50%;background:var(--green-mid);display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;}
  .chat-header-info h4{font-size:0.9rem;font-weight:700;}
  .chat-header-info p{font-size:0.72rem;color:var(--text-light);}
  .messages-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  .msg-bubble{max-width:65%;padding:10px 14px;border-radius:14px;font-size:0.875rem;line-height:1.5;word-break:break-word;}
  .msg-bubble.sent{background:var(--green-light);color:white;border-bottom-right-radius:4px;align-self:flex-end;}
  .msg-bubble.recv{background:var(--white);color:var(--text-dark);border:1px solid var(--border);border-bottom-left-radius:4px;align-self:flex-start;}
  .msg-time{font-size:0.65rem;opacity:0.6;margin-top:4px;}
  .msg-group{display:flex;flex-direction:column;}
  .msg-group.sent{align-items:flex-end;}
  .msg-group.recv{align-items:flex-start;}
  .msg-sender{font-size:0.68rem;color:var(--text-light);margin-bottom:3px;padding:0 4px;}

  .chat-input-area{padding:14px 20px;background:var(--white);border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;}
  .chat-input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:0.875rem;outline:none;resize:none;max-height:120px;min-height:42px;overflow-y:auto;}
  .chat-input:focus{border-color:var(--green-light);}
  .send-btn{width:42px;height:42px;background:var(--amber);border:none;border-radius:12px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:background 0.2s;flex-shrink:0;}
  .send-btn:hover{background:var(--amber-light);}
  .send-btn:disabled{opacity:0.5;cursor:not-allowed;}

  .no-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-light);text-align:center;padding:40px;}
  .no-chat .ei{font-size:3.5rem;margin-bottom:14px;}
  .no-chat h3{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--text-dark);margin-bottom:6px;}

  .empty-convos{padding:40px 20px;text-align:center;color:var(--text-light);}
  .empty-convos .ei{font-size:2.5rem;margin-bottom:10px;}

  .skeleton-line{height:56px;background:linear-gradient(90deg,#e8f0e0 25%,#d4e0c4 50%,#e8f0e0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:0;border-bottom:1px solid var(--border);}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<header class="topbar">
  <div><h2>💬 Messages</h2><p>Chat with farmers about their listings</p></div>
</header>

<div class="chat-layout">

  <!-- CONVERSATION LIST -->
  <div class="convo-list">
    <div class="convo-search">
      <input type="text" id="convo-search" placeholder="Search conversations..." oninput="filterConvos()">
    </div>
    <div class="convo-items" id="convo-items">
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
    </div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area" id="chat-area">
    <div class="no-chat">
      <div class="ei">💬</div>
      <h3>Select a conversation</h3>
      <p>Choose a farmer from the left to start chatting</p>
    </div>
  </div>

</div>

<script src="app.js"></script>
<script>
  let allConvos    = [];
  let activeContact = null;
  let pollInterval  = null;

  async function loadConversations() {
    const data = await apiFetch(`messages.php?user_id=${buyerId()}`);
    allConvos = data.conversations || [];
    renderConvos(allConvos);
  }

  function renderConvos(list) {
    const el = document.getElementById('convo-items');
    if (!list.length) {
      el.innerHTML = `<div class="empty-convos"><div class="ei">💬</div><p>No conversations yet.<br>Order from a farmer to start chatting.</p></div>`;
      return;
    }
    el.innerHTML = list.map(c => {
      const initials = c.contact_name?.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase() || '?';
      const unread   = !c.is_read && c.sender_id != buyerId();
      const isActive = activeContact?.contact_id == c.contact_id;
      return `
        <div class="convo-item ${isActive?'active':''}" onclick="openChat(${c.contact_id}, '${c.contact_name}', '${c.contact_role||'farmer'}')">
          <div class="convo-avatar" style="background:${strToColor(c.contact_name)}">${initials}</div>
          <div class="convo-info">
            <div class="convo-name">${c.contact_name}</div>
            <div class="convo-preview">${c.last_message || '...'}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
            <span class="convo-time">${timeAgo(c.created_at)}</span>
            ${unread ? '<div class="unread-dot"></div>' : ''}
          </div>
        </div>`;
    }).join('');
  }

  function filterConvos() {
    const q = document.getElementById('convo-search').value.toLowerCase();
    renderConvos(allConvos.filter(c => c.contact_name?.toLowerCase().includes(q)));
  }

  async function openChat(contactId, contactName, contactRole) {
    activeContact = { contact_id: contactId, contact_name: contactName };
    renderConvos(allConvos); // re-render to show active state

    const initials = contactName.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    document.getElementById('chat-area').innerHTML = `
      <div class="chat-header">
        <div class="chat-header-avatar" style="background:${strToColor(contactName)}">${initials}</div>
        <div class="chat-header-info">
          <h4>${contactName}</h4>
          <p>${contactRole === 'farmer' ? '🧑‍🌾 Farmer' : '👤 User'}</p>
        </div>
      </div>
      <div class="messages-area" id="messages-area"></div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="msg-input" placeholder="Type a message..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMsg()">➤</button>
      </div>`;

    await loadMessages();

    // Poll for new messages every 5 seconds
    clearInterval(pollInterval);
    pollInterval = setInterval(loadMessages, 5000);
  }

  async function loadMessages() {
    if (!activeContact) return;
    const data     = await apiFetch(`messages.php?user_id=${buyerId()}&with=${activeContact.contact_id}`);
    const messages = data.messages || [];
    const area     = document.getElementById('messages-area');
    if (!area) return;

    const wasAtBottom = area.scrollHeight - area.clientHeight <= area.scrollTop + 10;

    if (!messages.length) {
      area.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);font-size:0.85rem;">No messages yet. Say hello! 👋</div>';
      return;
    }

    area.innerHTML = messages.map(m => {
      const isSent = m.sender_id == buyerId();
      return `
        <div class="msg-group ${isSent?'sent':'recv'}">
          <div class="msg-bubble ${isSent?'sent':'recv'}">
            ${m.message}
            <div class="msg-time">${timeAgo(m.created_at)}</div>
          </div>
        </div>`;
    }).join('');

    if (wasAtBottom || messages.length < 10) area.scrollTop = area.scrollHeight;
  }

  async function sendMsg() {
    const input = document.getElementById('msg-input');
    const btn   = document.getElementById('send-btn');
    const msg   = input?.value.trim();
    if (!msg || !activeContact) return;

    btn.disabled = true;
    const res = await apiFetch(`messages.php?user_id=${buyerId()}`, {
      method: 'POST',
      body: JSON.stringify({ receiver_id: activeContact.contact_id, message: msg })
    });
    btn.disabled = false;

    if (res.error) { showToast(res.error, 'error'); return; }
    input.value = '';
    await loadMessages();
    loadConversations();
  }

  // Helper: consistent color from name string
  function strToColor(str) {
    let hash = 0;
    for (let i = 0; i < (str||'').length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    const colors = ['#2d5a1b','#1a3a1a','#4a7c2f','#3a7bd5','#8b4513','#556b2f','#2e8b57'];
    return colors[Math.abs(hash) % colors.length];
  }

  function timeAgo(dt) {
    if (!dt) return '';
    const diff = (Date.now() - new Date(dt)) / 1000;
    if (diff < 60)   return 'just now';
    if (diff < 3600) return Math.floor(diff/60) + 'm ago';
    if (diff < 86400)return Math.floor(diff/3600) + 'h ago';
    return formatDate(dt);
  }

  loadConversations();
</script>
</body>
</html>
