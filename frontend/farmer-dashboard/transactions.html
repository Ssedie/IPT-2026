<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--green-dark:#1a3a1a;--green-light:#4a7c2f;--green-pale:#e8f0e0;--amber:#e8a020;--cream:#faf6ed;--white:#fff;--text-dark:#1a2a0a;--text-mid:#3a4a2a;--text-light:#6a7a5a;--border:#d4e0c4;--red:#d94f4f;}
  *{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;font-family:'DM Sans',sans-serif;background:#f0f4ea;color:var(--text-dark);}
  body{display:flex;flex-direction:column;}
  .topbar{flex-shrink:0;background:var(--white);padding:16px 32px;border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(0,0,0,0.05);}
  .topbar h2{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;}
  .topbar p{font-size:0.8rem;color:var(--text-light);margin-top:2px;}
  .content{flex:1;overflow-y:auto;padding:24px 32px;}
  .table-wrap{background:var(--white);border-radius:16px;border:1px solid var(--border);overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,0.04);}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-light);padding:12px 16px;border-bottom:2px solid var(--border);background:var(--white);}
  td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:0.875rem;}
  tr:last-child td{border-bottom:none;}tr:hover td{background:var(--green-pale);}
  .amount-cell{font-weight:700;color:var(--green-light);}
  .badge-completed{background:rgba(74,124,47,0.12);color:#2d6a10;font-size:0.65rem;font-weight:700;padding:3px 8px;border-radius:6px;}
  .skeleton{background:linear-gradient(90deg,#e8f0e0 25%,#d4e0c4 50%,#e8f0e0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;height:48px;}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .empty{text-align:center;padding:48px;color:var(--text-light);}
</style>
</head>
<body>
<header class="topbar"><h2>🧾 Transactions</h2><p>All payment records for your orders</p></header>
<div class="content">
  <div class="table-wrap">
    <table>
      <thead><tr><th>#</th><th>Product</th><th>Buyer</th><th>Amount</th><th>Type</th><th>Status</th><th>Date</th></tr></thead>
      <tbody id="txn-body"><tr><td colspan="7"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></td></tr></tbody>
    </table>
  </div>
</div>
<script src="app.js"></script>
<script>
  async function loadTxns(){
    const tbody=document.getElementById('txn-body');
    const data=await apiFetch(`farmer_earnings.php?farmer_id=${farmerId()}`);
    const txns=data.transactions||[];
    if(!txns.length){tbody.innerHTML='<tr><td colspan="7"><div class="empty">No transactions yet.</div></td></tr>';return;}
    tbody.innerHTML=txns.map(t=>`
      <tr>
        <td>#${t.order_id}</td>
        <td>${t.product_name||'—'}</td>
        <td>${t.buyer_name||'—'}</td>
        <td class="amount-cell">${formatMoney(t.amount)}</td>
        <td>${t.type||'payment'}</td>
        <td><span class="badge-completed">${t.status}</span></td>
        <td>${formatDate(t.created_at)}</td>
      </tr>`).join('');
  }
  loadTxns();
</script>
</body>
</html>
